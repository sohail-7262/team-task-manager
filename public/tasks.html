<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Tasks</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <button class="mobile-toggle" aria-label="Menu">☰</button>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <h1>✅ <span>Task Board</span></h1>
        <button class="btn btn-primary" id="createTaskBtn" onclick="openTaskModal()">+ New Task</button>
      </div>
      <div class="filters-bar">
        <select class="filter-select" id="filterProject" onchange="loadTasks()"><option value="">All Projects</option></select>
        <select class="filter-select" id="filterPriority" onchange="loadTasks()">
          <option value="">All Priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
        </select>
      </div>
      <div class="kanban-board" id="kanbanBoard">
        <div class="kanban-column column-todo" id="colTodo" ondragover="allowDrop(event)" ondrop="handleDrop(event,'todo')">
          <div class="kanban-column-header"><h3>📋 To Do <span class="count" id="countTodo">0</span></h3></div>
          <div class="kanban-tasks" id="tasksTodo"></div>
        </div>
        <div class="kanban-column column-progress" id="colProgress" ondragover="allowDrop(event)" ondrop="handleDrop(event,'in-progress')">
          <div class="kanban-column-header"><h3>🔄 In Progress <span class="count" id="countProgress">0</span></h3></div>
          <div class="kanban-tasks" id="tasksProgress"></div>
        </div>
        <div class="kanban-column column-done" id="colDone" ondragover="allowDrop(event)" ondrop="handleDrop(event,'done')">
          <div class="kanban-column-header"><h3>✅ Done <span class="count" id="countDone">0</span></h3></div>
          <div class="kanban-tasks" id="tasksDone"></div>
        </div>
      </div>
    </main>
  </div>
  <!-- Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal-header"><h2 id="taskModalTitle">New Task</h2><button class="modal-close" onclick="closeTaskModal()">✕</button></div>
      <form id="taskForm" onsubmit="handleTaskSubmit(event)">
        <div class="form-group"><label for="taskTitle">Title</label><input type="text" id="taskTitle" required minlength="2" maxlength="150" placeholder="Task title"></div>
        <div class="form-group"><label for="taskDesc">Description</label><textarea id="taskDesc" rows="3" maxlength="1000" placeholder="Optional description..." style="resize:vertical"></textarea></div>
        <div class="form-group"><label for="taskProject">Project</label><select id="taskProject" required></select></div>
        <div class="form-group"><label for="taskAssignee">Assignee</label><select id="taskAssignee"><option value="">Unassigned</option></select></div>
        <div class="form-group"><label for="taskPriority">Priority</label><select id="taskPriority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div>
        <div class="form-group" id="taskStatusGroup" style="display:none"><label for="taskStatus">Status</label><select id="taskStatus"><option value="todo">To Do</option><option value="in-progress">In Progress</option><option value="done">Done</option></select></div>
        <div class="form-group"><label for="taskDue">Due Date</label><input type="date" id="taskDue"></div>
        <input type="hidden" id="taskId">
        <div class="modal-actions"><button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Cancel</button><button type="submit" class="btn btn-primary" id="taskSubmitBtn">Create</button></div>
      </form>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/tasks.js"></script>
</body>
</html>
