<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <button class="mobile-toggle" aria-label="Menu">☰</button>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <h1>👋 Welcome, <span id="userName">User</span></h1>
      </div>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card info"><div class="stat-icon">📋</div><div class="stat-value" id="totalTasks">0</div><div class="stat-label">Total Tasks</div></div>
        <div class="stat-card warning"><div class="stat-icon">🔄</div><div class="stat-value" id="inProgress">0</div><div class="stat-label">In Progress</div></div>
        <div class="stat-card success"><div class="stat-icon">✅</div><div class="stat-value" id="completed">0</div><div class="stat-label">Completed</div></div>
        <div class="stat-card overdue"><div class="stat-icon">⚠️</div><div class="stat-value" id="overdue">0</div><div class="stat-label">Overdue</div></div>
      </div>
      <div class="grid-2">
        <div class="card">
          <div class="card-header"><h2>📌 Recent Tasks</h2></div>
          <div id="recentTasks"><div class="page-loader"><span class="spinner"></span></div></div>
        </div>
        <div class="card">
          <div class="card-header"><h2>⚠️ Overdue Tasks</h2></div>
          <div id="overdueTasks"><div class="page-loader"><span class="spinner"></span></div></div>
        </div>
      </div>
      <div class="card" style="margin-top:24px">
        <div class="card-header"><h2>📁 Project Progress</h2></div>
        <div id="projectProgress"><div class="page-loader"><span class="spinner"></span></div></div>
      </div>
    </main>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
